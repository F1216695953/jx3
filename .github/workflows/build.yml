name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: UTF-8
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --no-deps -r requirements.txt

      - name: Inline ok-script requirements
        run: python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      - name: Run tests
        run: python -m unittest discover -s tests -p '*.py'

      - name: Set installer version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $appVersion = $env:RELEASE_TAG -replace '^v', ''
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV

      - name: Build with PyAppify
        uses: ok-oldking/pyappify-action@master
        with:
          add_version_name: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          body: |
            剑网3无界日常助手 ${{ env.APP_VERSION }}

            - OCR 默认改用 ONNX Runtime CPU，避开已报告的 OpenVINO compile_model 访问冲突路径。
            - 安装包补齐 ONNX Runtime 依赖，并加入真实 OCR 初始化和识别测试。
            - 仍需在曾闪退的 Windows 10 电脑上验证启动与识别。

            - China installer: jx3-wujie-daily-assistant-win32-China-setup-${{ env.APP_VERSION }}.exe
            - Global installer: jx3-wujie-daily-assistant-win32-Global-setup-${{ env.APP_VERSION }}.exe
            - Source and update repository: https://github.com/F1216695953/jx3
          files: pyappify_dist/*
