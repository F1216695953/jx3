name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: UTF-8
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --no-deps -r requirements.txt

      - name: Inline ok-script requirements
        run: python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      - name: Run tests
        run: python -m unittest discover -s tests -p '*.py'

      - name: Set installer version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $appVersion = $env:RELEASE_TAG -replace '^v', ''
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV

      - name: Build with PyAppify
        uses: ok-oldking/pyappify-action@master
        with:
          add_version_name: true

      - name: Save Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-${{ github.ref_name }}
          path: pyappify_dist/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = @"
            剑网3无界日常助手 ${{ env.APP_VERSION }}

            - 返回角色：确认主界面后打开菜单，识别指定区域的“角色”并点击；未命中时重新检测主界面。
            - 跑商循环：第1步未识别到“据点/日常”时直接进入第2步。
            - 跑商接取：活动日历中识别到“已完成”时显示“跑商已结束”，跳过后续跑商循环。
            - 沿用 ONNX Runtime CPU OCR；仍需在目标电脑上验证游戏中的完整流程。

            - China installer: jx3-wujie-daily-assistant-win32-China-setup-${{ env.APP_VERSION }}.exe
            - Global installer: jx3-wujie-daily-assistant-win32-Global-setup-${{ env.APP_VERSION }}.exe
            - Source and update repository: https://github.com/F1216695953/jx3
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'jx3-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          $ready = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            gh release view $env:RELEASE_TAG --json tagName *> $null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            gh release create $env:RELEASE_TAG --draft --title $env:RELEASE_TAG --notes-file $notesPath --target $env:GITHUB_SHA
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            if ($attempt -lt 4) { Start-Sleep -Seconds 10 }
          }
          if (-not $ready) { throw 'Unable to prepare GitHub release after four attempts.' }
          $installers = @(Get-ChildItem -Path pyappify_dist -Filter '*.exe' -File)
          if ($installers.Count -lt 3) { throw 'Expected China, Global and online installers.' }
          foreach ($installer in $installers) {
            $uploaded = $false
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              gh release upload $env:RELEASE_TAG $installer.FullName --clobber
              if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
              if ($attempt -lt 4) { Start-Sleep -Seconds 10 }
            }
            if (-not $uploaded) { throw "Upload failed: $($installer.Name). Build artifacts are available for recovery." }
          }
          $published = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            gh release edit $env:RELEASE_TAG --draft=false --latest --notes-file $notesPath
            if ($LASTEXITCODE -eq 0) { $published = $true; break }
            if ($attempt -lt 4) { Start-Sleep -Seconds 10 }
          }
          if (-not $published) { throw 'Installers uploaded, but release could not be published.' }
